[workspace]
members = ["."]

[package]
name = "pulse_map"
version = "0.6.5"
edition = "2021"
rust-version = "1.70.0"
authors = ["Deendayal Kumawat <deendayal_kumawat@outlook.com>"]
description = "A CPU cache-line hash table with zero-cost eviction. Every bucket fits in exactly one 64-byte cache line with embedded LFU+LRU eviction metadata."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ddsha441981/pulse_map"
homepage = "https://github.com/ddsha441981/pulse_map"
documentation = "https://ddsha441981.github.io/pulse_map/"
readme = "README.md"
keywords = ["cache", "hashmap", "lru", "lfu", "no-std"]
categories = ["data-structures", "caching", "no-std", "concurrency"]
# Keep IDE config and stray example output out of the published crate.
exclude = [".idea/", "*.out", "evaluation/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
portable-atomic = { version = "1.6", default-features = false, features = ["fallback"] }
wyhash = "0.5"

# loom is only resolved when `--cfg loom` is in RUSTFLAGS. It must be a regular
# dependency, not a dev-dependency: `src/engine/{meta,access_buffer}.rs` import it,
# and the plain lib build that `tests/loom_*.rs` links against has no dev-dependencies.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[features]
default = ["std"]
std = []
simd = []

# Cortex-M0/M0+ (thumbv6m) and RISC-V without the A extension (riscv32imc) have no
# atomic CAS instruction, so portable-atomic's spinlock fallback cannot build and
# `AtomicU64` is simply absent there. This routes the CAS through a critical section
# instead. The final binary supplies the impl — e.g. `cortex-m` with its
# `critical-section-single-core` feature, or `esp-hal` on the ESP32-C3.
critical-section = ["portable-atomic/critical-section"]

# `cfg(loom)` is set through RUSTFLAGS, so rustc's --check-cfg (1.80+) would otherwise
# warn on every `#[cfg(loom)]` and fail CI's `clippy -D warnings`.
# Ignored with an "unused manifest key" warning on cargo < 1.74, which is fine:
# --check-cfg did not exist then either.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
rand_distr = "0.4"
lru = "0.12"
moka = { version = "0.12", features = ["sync"] }
quick_cache = "0.6"

[[bench]]
name = "benchmark"
harness = false

[[example]]
name = "basic"
required-features = ["std"]

[[example]]
name = "concurrent"
required-features = ["std"]

[[example]]
name = "all_scenarios"
required-features = ["std"]

[[example]]
name = "memory_baseline"
required-features = ["std"]

[[example]]
name = "production_suite_test"
required-features = ["std"]

[[example]]
name = "quality_and_readheavy"
required-features = ["std"]

[[example]]
name = "readratio_isolated"
required-features = ["std"]

[[example]]
name = "real_world_latency_spikes"
required-features = ["std"]
[[example]]
name = "soak_test"
required-features = ["std"]

[[example]]
name = "drain_latency"
required-features = ["std"]

[[example]]
name = "hitrate_16384"
required-features = ["std"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1




# ═══════════════════════════════════════════════════════════════
# Documentation
# ═══════════════════════════════════════════════════════════════
#
# API Docs (docs.rs):
#   cargo doc --no-deps --open
#   RUSTDOCFLAGS="-D warnings" cargo doc --no-deps  (strict mode)
#
# mdbook Guide (docs/ directory):
#   cargo install mdbook              ← install once
#   cd docs && mdbook build           ← generate HTML → docs/book/
#   cd docs && mdbook serve           ← live preview at localhost:3000
#   cd docs && mdbook clean           ← remove generated files
#
# Available mdbook themes:
#   light  — Clean white background (classic)
#   rust   — Warm beige/brown (Rust docs style)
#   coal   — Dark charcoal background
#   navy   — Deep navy blue (default, modern dark)
#   ayu    — Ayu dark, soft golden accents
#
# Theme config: docs/book.toml → [output.html] → default-theme
# ═══════════════════════════════════════════════════════════════

name: Rust CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ═══════════════════════════════════════════════════════════
  # Format Check
  # ═══════════════════════════════════════════════════════════
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -p pulse_map -- --check

  # ═══════════════════════════════════════════════════════════
  # Clippy Lint
  # ═══════════════════════════════════════════════════════════
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p pulse_map -- -D warnings
      - run: cargo clippy -p pulse_map --no-default-features -- -D warnings
      - run: cargo clippy -p pulse_map --features simd -- -D warnings

  # ═══════════════════════════════════════════════════════════
  # Build + Test (multi-platform)
  # ═══════════════════════════════════════════════════════════
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2

      # Build
      - name: Build (default features)
        run: cargo build -p pulse_map

      - name: Build (no_std)
        run: cargo build -p pulse_map --no-default-features

      - name: Build (simd)
        if: matrix.os != 'macos-latest'
        run: cargo build -p pulse_map --features simd

      # Test
      - name: Test (default features)
        run: cargo test -p pulse_map

      - name: Test (no_std)
        run: cargo test -p pulse_map --no-default-features

      - name: Test (simd)
        if: matrix.os != 'macos-latest'
        run: cargo test -p pulse_map --features simd

  # ═══════════════════════════════════════════════════════════
  # MSRV (Minimum Supported Rust Version)
  # ═══════════════════════════════════════════════════════════
  msrv:
    name: MSRV (1.70.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.70.0"
      - run: cargo check -p pulse_map
      - run: cargo check -p pulse_map --no-default-features
      - run: cargo build -p pulse_map

  # ═══════════════════════════════════════════════════════════
  # Documentation
  # ═══════════════════════════════════════════════════════════
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc -p pulse_map --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # ═══════════════════════════════════════════════════════════
  # Publish to crates.io (on tag push only)
  # ═══════════════════════════════════════════════════════════
  publish:
    name: Publish to crates.io
    needs: [fmt, clippy, test, msrv, docs]
    runs-on: ubuntu-latest
    if: false # Disabled: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cargo publish -p pulse_map
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
